// New Architecture only (React Native 0.76+): the module extends the TurboModule spec generated by Codegen.
// The host app provides the Android Gradle and Kotlin plugins.
buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

android {
  namespace 'com.reactnativemlkittranslation'
  compileSdkVersion safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)
    targetSdkVersion safeExtGet('targetSdkVersion', 35)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.google.mlkit:translate:17.0.3"

  testImplementation "junit:junit:4.13.2"
}

react {
  jsRootDir = file("../src/")
  libraryName = "RNMLKitTranslationSpec"
  codegenJavaPackageName = "com.reactnativemlkittranslation"
}
